name: bemodel

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4.10
    pull_policy: never
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: bemodel_platform
      MYSQL_USER: bemodel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-app-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -uroot --protocol=socket -Nse 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  backend:
    image: eclipse-temurin:21-jre-jammy
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    working_dir: /app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: bemodel_platform
      MYSQL_USERNAME: bemodel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1536m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    command: ["java", "-jar", "/app/bemodel-server-1.0.0.jar", "--spring.config.additional-location=file:/config/"]
    volumes:
      - ./backend/bemodel-server-1.0.0.jar:/app/bemodel-server-1.0.0.jar:ro
      - ./application-prod.yml:/config/application-prod.yml:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18080; printf \"GET /api/auth/me HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \" 401 \"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    logging: *logging

  web:
    image: nginx:stable-alpine
    pull_policy: never
    restart: unless-stopped
    ports:
      - "18081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  mysql_data:
